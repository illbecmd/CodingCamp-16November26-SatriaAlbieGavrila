<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Storage unavailability banner (hidden by default) -->
  <div id="storage-banner" class="banner banner--hidden" role="alert" aria-live="polite">
    <span class="banner__icon" aria-hidden="true">⚠</span>
    <span class="banner__message">
      Storage is unavailable in this session. Your tasks and links will not be saved between page reloads.
    </span>
  </div>

  <main class="dashboard">

    <!-- Widget 1: Greeting & Clock -->
    <section id="greeting" class="widget widget--greeting" aria-label="Greeting and clock">
      <div class="widget__inner">
        <p id="greeting-message" class="greeting__message">Good Morning</p>
        <p id="greeting-time" class="greeting__time" aria-live="polite" aria-atomic="true">00:00:00</p>
        <p id="greeting-date" class="greeting__date">Monday, 01 January 2026</p>
      </div>
    </section>

    <!-- Widget 2: Focus Timer -->
    <section id="timer" class="widget widget--timer" aria-label="Focus timer">
      <div class="widget__inner">
        <h2 class="widget__heading">Focus Timer</h2>
        <div id="timer-display" class="timer__display" aria-live="polite" aria-atomic="true">25:00</div>
        <div id="timer-done-indicator" class="timer__done-indicator timer__done-indicator--hidden" role="status">
          Session complete! Great work.
        </div>
        <div class="timer__controls">
          <button id="timer-start" class="btn btn--primary" type="button" aria-label="Start timer">Start</button>
          <button id="timer-stop"  class="btn btn--secondary" type="button" aria-label="Stop timer" disabled>Stop</button>
          <button id="timer-reset" class="btn btn--ghost" type="button" aria-label="Reset timer">Reset</button>
        </div>
      </div>
    </section>

    <!-- Widget 3: To-Do List -->
    <section id="task-list" class="widget widget--tasks" aria-label="To-do list">
      <div class="widget__inner">
        <h2 class="widget__heading">To-Do List</h2>

        <!-- Add task form -->
        <form id="add-task-form" class="add-form" novalidate aria-label="Add a new task">
          <div class="add-form__field">
            <label for="task-input" class="sr-only">New task title</label>
            <input
              id="task-input"
              class="add-form__input"
              type="text"
              placeholder="Add a new task…"
              autocomplete="off"
              aria-describedby="task-input-error"
            />
            <button class="btn btn--primary" type="submit" aria-label="Add task">Add</button>
          </div>
          <span id="task-input-error" class="form__error" role="alert" aria-live="polite"></span>
        </form>

        <!-- Task items rendered here by JS -->
        <ul id="task-items" class="task-list" aria-label="Tasks" aria-live="polite">
          <!-- Task items injected by TaskListWidget.render() -->
        </ul>
      </div>
    </section>

    <!-- Widget 4: Quick Links -->
    <section id="quick-links" class="widget widget--links" aria-label="Quick links">
      <div class="widget__inner">
        <h2 class="widget__heading">Quick Links</h2>

        <!-- Add link form -->
        <form id="add-link-form" class="add-form" novalidate aria-label="Add a quick link">
          <div class="add-form__field">
            <label for="link-label-input" class="sr-only">Link label</label>
            <input
              id="link-label-input"
              class="add-form__input"
              type="text"
              placeholder="Label (max 50 chars)"
              maxlength="50"
              autocomplete="off"
              aria-describedby="link-label-error"
            />
          </div>
          <span id="link-label-error" class="form__error" role="alert" aria-live="polite"></span>
          <div class="add-form__field">
            <label for="link-url-input" class="sr-only">Link URL</label>
            <input
              id="link-url-input"
              class="add-form__input"
              type="url"
              placeholder="https://example.com"
              autocomplete="off"
              aria-describedby="link-url-error"
            />
          </div>
          <span id="link-url-error" class="form__error" role="alert" aria-live="polite"></span>
          <span id="link-count-error" class="form__error" role="alert" aria-live="polite"></span>
          <button class="btn btn--primary" type="submit" aria-label="Add link">Add Link</button>
        </form>

        <!-- Link buttons rendered here by JS -->
        <div id="link-items" class="link-grid" aria-label="Quick links" aria-live="polite">
          <!-- Link buttons injected by QuickLinksWidget.render() -->
        </div>
      </div>
    </section>

  </main>

  <!-- Inlined audio alert for timer completion (base64 data-URI set by JS) -->
  <audio id="timer-alert" aria-hidden="true"></audio>

  <script src="js/app.js"></script>
</body>
</html>
